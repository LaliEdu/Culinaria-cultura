<!DOCTYPE html>
<html>
<head>
  <title>Culinária&Cultura.site</title>
  <link rel="stylesheet" type="text/css" href="/css/informativo.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>FeedBack</h1>
      <nav>
        <ul>
          <li class="nav-item"><a class="nav-link" href="/informativo/feedback.html">FeedBack</a></li>
          <li class="nav-item"><a class="nav-link" href="/index.html">Inicio</a></li>
        </ul>
      </nav>
    </header>
    <div class="caixa">
    <section id="agendamento">
      <h2>Cadastre-se:</h2>
      <form id="formulario-agendamento">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="senha">Senha:</label>
        <input type="text-number" id="Senha" name="senha" required><br><br>


        <h2>Deixe seu comentario:</h2>
        <!--Comentário-->
        <form class="comment-form" action="" method="POST">
          <input type="text" name="name" placeholder="Seu nome" required><br><br>
          <textarea name="comment" placeholder="Escreva seu comentário" rows="4" required></textarea>
          
      </form><br><br>
    

        <h2>Avalie nosso site:</h2>
        <div class="rating">
            <input type="radio" id="star1" name="rating" value="5" />
            <label for="star1" title="5 estrelas">&#9733;</label>
            <input type="radio" id="star2" name="rating" value="4" />
            <label for="star2" title="4 estrelas">&#9733;</label>
            <input type="radio" id="star3" name="rating" value="3" />
            <label for="star3" title="3 estrelas">&#9733;</label>
            <input type="radio" id="star4" name="rating" value="2" />
            <label for="star4" title="2 estrelas">&#9733;</label>
            <input type="radio" id="star5" name="rating" value="1" />
            <label for="star5" title="1 estrela">&#9733;</label>
          </div>

          <button type="submit">Enviar</button>
      </form>
    </section>
    </div>

    <footer>
      <p>&copy; Todos os direitos reservados 2025 </p>
    </footer>
  </div>

  <script src="/js/scripts.js"></script>
</body>
</html>
